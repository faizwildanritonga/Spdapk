name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Pakai setup-gradle, bukan ./gradlew -- jadi tidak perlu commit
      # gradle-wrapper.jar (binary) ke repo. Kalau nanti mau pakai gradlew
      # lokal di Android Studio, jalankan `gradle wrapper` sekali di
      # project ini untuk generate wrapper-nya sendiri.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spd-usb-check-debug
          path: app/build/outputs/apk/debug/*.apk
