name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Install NDK + CMake
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          CMDLINE_TOOLS_BIN=$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)")
          echo "Pakai sdkmanager dari: $CMDLINE_TOOLS_BIN"
          echo "$CMDLINE_TOOLS_BIN" >> "$GITHUB_PATH"
          yes | "$CMDLINE_TOOLS_BIN/sdkmanager" --licenses || true
          "$CMDLINE_TOOLS_BIN/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spd-usb-check-debug
          path: app/build/outputs/apk/debug/*.apk
